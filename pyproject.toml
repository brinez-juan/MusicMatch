[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicmatch"
version = "0.1.0"
description = "Fetches Spotify metadata, audio features, and lyric sentiment, then recommends similar tracks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.23",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "transformers>=4.40",
    "torch>=2.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
musicmatch = "musicmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "smoke: end-to-end test that hits live APIs (requires .env)",
]
addopts = "-m 'not smoke'"
testpaths = ["tests"]
